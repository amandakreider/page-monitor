name: Page Monitor

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        id: monitor
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          output=$(python watchpage.py)
          echo "$output"
          echo "$output" >> $GITHUB_OUTPUT

      - name: Create issue body if page changed
        if: contains(steps.monitor.outputs.PAGE_CHANGED, 'true')
        run: |
          sed "s|{{URL}}|${TARGET_URL}|g" .github/issue-body.md > issue-body-rendered.md
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}

      - name: Create or update issue if page changed
        if: contains(steps.monitor.outputs.PAGE_CHANGED, 'true')
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Page content changed"
          content-filepath: issue-body-rendered.md
          labels: monitoring, automated

      - name: Commit state files
        run: |
          if [ -f page_hash.txt ] || [ -f last_modified.txt ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -f page_hash.txt last_modified.txt || true
            git commit -m "Update page state" || echo "No changes"
            git push
          else
            echo "No state files created; skipping commit"
          fi

