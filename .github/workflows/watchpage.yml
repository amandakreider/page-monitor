name: NIA Page Monitor

on:
  schedule:
    - cron: "0 13 * * *"   # once per day (13:00 UTC = 9am ET)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        id: monitor
        run: |
          output=$(python watchpage.py)
          echo "$output"
          echo "$output" >> $GITHUB_OUTPUT

      - name: Create or update issue if page changed
        if: contains(steps.monitor.outputs.PAGE_CHANGED, 'true')
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "NIA Dementia Care Summit page changed"
          content-filepath: .github/issue-body.md
          labels: monitoring, automated

      - name: Commit state file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add page_hash.txt
          git commit -m "Update page hash" || echo "No changes"
          git push
